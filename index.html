<style>
:root{--noir:#0D0D0D;--noir-2:#1A1A1A;--noir-3:#242424;--bordeaux:#7B1E2E;--bordeaux-2:#9B2335;--bordeaux-light:#C0394A;--or:#C9A84C;--or-light:#E8C96A;--creme:#F5F0E8;--gris:#8A8A8A;--gris-2:#555;--gris-light:#E8E8E8;--success:#2D9E6B;--radius:14px;--radius-lg:20px;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--noir);color:var(--creme);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--noir-2);}::-webkit-scrollbar-thumb{background:var(--bordeaux);border-radius:3px;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:var(--radius);padding:12px 24px;font-weight:600;font-size:14px;cursor:pointer;transition:all .22s;font-family:'Outfit',sans-serif;text-decoration:none;white-space:nowrap;}
.btn-primary{background:var(--bordeaux);color:#fff;}.btn-primary:hover{background:var(--bordeaux-2);transform:translateY(-1px);box-shadow:0 8px 28px rgba(123,30,46,.4);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-secondary{background:var(--or);color:var(--noir);}.btn-secondary:hover{background:var(--or-light);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--creme);border:1.5px solid rgba(245,240,232,.18);}.btn-ghost:hover{border-color:var(--bordeaux-light);color:#fff;background:rgba(123,30,46,.1);}
.btn-danger{background:transparent;color:var(--bordeaux-light);border:1.5px solid var(--bordeaux);font-size:13px;}.btn-danger:hover{background:var(--bordeaux);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}.btn-lg{padding:15px 32px;font-size:16px;}.btn-full{width:100%;justify-content:center;}.btn-icon{width:38px;height:38px;padding:0;border-radius:10px;justify-content:center;}
.card{background:var(--noir-2);border:1px solid rgba(245,240,232,.07);border-radius:var(--radius-lg);transition:all .25s;}.card:hover{border-color:rgba(123,30,46,.35);box-shadow:0 8px 40px rgba(0,0,0,.4);}

.field{background:var(--noir-3);border:1.5px solid rgba(245,240,232,.1);border-radius:var(--radius);padding:12px 16px;color:var(--creme);width:100%;font-size:14px;outline:none;transition:all .2s;font-family:'Outfit',sans-serif;}
.field:focus{border-color:var(--bordeaux-light);background:rgba(123,30,46,.06);}.field::placeholder{color:var(--gris);}.field.error{border-color:#C0394A;}
.field-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin-bottom:6px;display:block;}
.field-error{font-size:12px;color:#E87A8A;margin-top:4px;}.field-group{display:flex;flex-direction:column;gap:0;}
select.field{cursor:pointer;}select.field option{background:var(--noir-2);color:var(--creme);}
.tag{background:rgba(123,30,46,.18);color:#E87A8A;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;display:inline-block;}
.tag-or{background:rgba(201,168,76,.15);color:var(--or-light);}.tag-green{background:rgba(45,158,107,.15);color:#4DC99A;}.tag-gray{background:rgba(255,255,255,.06);color:var(--gris);}
nav{background:rgba(13,13,13,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(123,30,46,.2);position:sticky;top:0;z-index:100;}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:68px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-link{background:none;border:none;color:rgba(245,240,232,.6);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;font-family:'Outfit',sans-serif;transition:all .2s;}
.nav-link:hover,.nav-link.active{color:var(--creme);background:rgba(123,30,46,.15);}.nav-link.active{color:var(--bordeaux-light);}
.nav-divider{width:1px;height:22px;background:rgba(255,255,255,.08);margin:0 8px;}
.hamburger{display:none;background:none;border:1px solid rgba(255,255,255,.12);border-radius:8px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--creme);}
.mobile-menu{display:none;background:var(--noir-2);border-bottom:1px solid rgba(123,30,46,.2);padding:16px 24px;}
.mobile-menu.open{display:flex;flex-direction:column;gap:4px;}
.mobile-nav-link{background:none;border:none;color:rgba(245,240,232,.7);padding:12px 16px;border-radius:8px;cursor:pointer;font-size:15px;font-family:'Outfit',sans-serif;text-align:left;width:100%;transition:background .2s;}

.logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;}
.logo-text{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:-.3px;}.logo-text span{color:var(--bordeaux-light);}
.hero{background:var(--noir);position:relative;overflow:hidden;padding:110px 24px 90px;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 70% 30%,rgba(123,30,46,.14),transparent 65%),radial-gradient(ellipse 40% 50% at 10% 80%,rgba(201,168,76,.06),transparent 55%);pointer-events:none;}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,240,232,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,240,232,.025) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;}
.hero-dot{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--bordeaux-light);opacity:.6;animation:blink 3s infinite;}
@keyframes blink{0%,100%{opacity:.6;}50%{opacity:.15;}}
.fade-in{animation:fadeIn .45s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideRight{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;top:24px;right:24px;background:linear-gradient(135deg,#1A2E1A,#2D9E6B);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:9999;animation:slideRight .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;max-width:340px;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--noir-2);border:1px solid rgba(123,30,46,.3);border-radius:var(--radius-lg);padding:36px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;animation:fadeIn .3s ease;box-shadow:0 32px 80px rgba(0,0,0,.6);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.modal-title{font-family:'Fraunces',serif;font-size:22px;color:#fff;}
.modal-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gris);font-size:16px;transition:all .2s;}
.modal-close:hover{background:rgba(123,30,46,.2);color:#fff;border-color:var(--bordeaux);}
.job-card{padding:22px;cursor:pointer;}.job-card:hover .job-title{color:var(--bordeaux-light);}
.logo-badge{border-radius:10px;background:linear-gradient(135deg,var(--noir-3),rgba(123,30,46,.15));border:1px solid rgba(123,30,46,.2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bordeaux-light);font-family:'Fraunces',serif;flex-shrink:0;}
.search-box{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:8px 8px 8px 20px;display:flex;gap:8px;align-items:center;transition:border .2s;}.search-box:focus-within{border-color:rgba(123,30,46,.5);}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;font-family:'Outfit',sans-serif;}.search-input::placeholder{color:rgba(245,240,232,.35);}
.pill{background:rgba(245,240,232,.07);border:1px solid rgba(245,240,232,.12);border-radius:20px;padding:6px 14px;font-size:12px;color:rgba(245,240,232,.6);cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-weight:500;}
.pill:hover{color:#fff;border-color:rgba(123,30,46,.5);background:rgba(123,30,46,.12);}
.boost-block{background:linear-gradient(135deg,#1A0A0E,#200D14);border:1px solid rgba(123,30,46,.4);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;}
.service-card{background:linear-gradient(135deg,var(--noir-2),#1A0D10);border:1px solid rgba(123,30,46,.2);border-radius:var(--radius-lg);padding:24px;transition:all .25s;cursor:pointer;}
.service-card:hover{border-color:rgba(123,30,46,.5);transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.4);}
.service-card.featured{border-color:var(--or);background:linear-gradient(135deg,#1A0D10,#1A1200);}
.stats-bar{background:#fff;border-bottom:1px solid var(--gris-light);}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.stat-item{padding:28px 32px;border-right:1px solid var(--gris-light);text-align:center;}.stat-item:last-child{border-right:none;}
.stat-val{font-family:'Fraunces',serif;font-size:36px;font-weight:700;color:var(--bordeaux);letter-spacing:-1px;}.stat-label{font-size:13px;color:#666;margin-top:4px;font-weight:500;}
.section-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--bordeaux-light);margin-bottom:12px;}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--bordeaux),#4A0F18);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-family:'Fraunces',serif;flex-shrink:0;}
.avatar-photo{border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(123,30,46,.4);}
.avatar-wrap{position:relative;display:inline-block;}
.avatar-upload-btn{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--bordeaux);border:2px solid var(--noir-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;}
.avatar-upload-btn:hover{background:var(--bordeaux-2);}

.footer-inner{max-width:1200px;margin:0 auto;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px;}
.footer-brand p{font-size:14px;color:var(--gris);line-height:1.7;margin-top:12px;max-width:260px;}
.footer-col h4{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gris);margin-bottom:16px;}
.footer-col ul{list-style:none;}.footer-col ul li{margin-bottom:10px;}
.footer-col ul li button,.footer-col ul li a{background:none;border:none;color:rgba(245,240,232,.55);font-size:14px;font-family:'Outfit',sans-serif;cursor:pointer;transition:color .2s;padding:0;text-decoration:none;}
.footer-col ul li button:hover,.footer-col ul li a:hover{color:var(--bordeaux-light);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.07);padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}

.footer-langs{display:flex;gap:8px;}
.lang-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;}
.lang-btn.active,.lang-btn:hover{background:var(--bordeaux);color:#fff;border-color:var(--bordeaux);}
.lang-btn:not(.active){color:var(--gris);}
.cv-preview{background:#fff;color:#111;border-radius:var(--radius-lg);overflow:hidden;}
.cv-head{background:linear-gradient(135deg,var(--bordeaux),#4A0F18);padding:36px 40px;color:#fff;}
.cv-body{padding:32px 40px;display:grid;grid-template-columns:1fr 260px;gap:36px;}
.cv-section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--bordeaux);border-bottom:2px solid var(--bordeaux);padding-bottom:6px;margin-bottom:14px;}
.admin-stat{background:var(--noir-3);border:1px solid rgba(123,30,46,.2);border-radius:var(--radius);padding:20px 24px;}
.admin-stat-val{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--bordeaux-light);}
.pagination{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:32px;}
.page-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--gris);cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.page-btn:hover{border-color:var(--bordeaux);color:var(--creme);}.page-btn.active{background:var(--bordeaux);color:#fff;border-color:var(--bordeaux);}.page-btn:disabled{opacity:.3;cursor:default;}
.step-bar{display:flex;gap:4px;margin-bottom:28px;}
.step-seg{flex:1;height:4px;border-radius:4px;transition:background .4s;}.step-seg.done{background:var(--bordeaux);}.step-seg.todo{background:rgba(255,255,255,.08);}
.tabs{display:flex;gap:2px;background:var(--noir-3);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.06);}
.tab{flex:1;padding:10px 16px;border-radius:8px;border:none;background:transparent;color:var(--gris);font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;}
.tab.active{background:var(--bordeaux);color:#fff;box-shadow:0 2px 12px rgba(123,30,46,.4);}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:8px;padding:3px;}
.lang-opt{padding:5px 10px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;}
.lang-opt.active{background:var(--bordeaux);color:#fff;}.lang-opt:not(.active){background:transparent;color:var(--gris);}
.float-contact{position:fixed;bottom:28px;right:28px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.float-btn{display:flex;align-items:center;gap:10px;color:#fff;border:none;border-radius:30px;padding:12px 18px;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:all .22s;text-decoration:none;}
.float-btn-wa{background:#25D366;}.float-btn-wa:hover{background:#1DB954;transform:translateY(-2px);}
.float-btn-mail{background:var(--bordeaux);}.float-btn-mail:hover{background:var(--bordeaux-2);transform:translateY(-2px);}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
@media(max-width:900px){
  .hamburger{display:flex;}.nav-links{display:none;}
  .footer-grid{grid-template-columns:1fr 1fr;gap:32px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .stat-item:nth-child(2){border-right:none;}
  .stat-item:nth-child(3){border-top:1px solid var(--gris-light);}
  .stat-item:nth-child(4){border-right:none;border-top:1px solid var(--gris-light);}
  .hero{padding:80px 20px 60px;}.cv-body{grid-template-columns:1fr!important;}
}
@media(max-width:600px){.footer-grid{grid-template-columns:1fr;}.modal{padding:24px 20px;}.float-contact{bottom:16px;right:16px;}}
</style>

<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ══════════════════════════════════════════
//  ⚙️  GOOGLE LOGIN — Remplace par ton Client ID
//  (voir instructions en bas de page)
// ══════════════════════════════════════════
window.GOOGLE_CLIENT_ID = '191220755178-eqo080hl1rj37nkvje01esi6mn1ga5s5.apps.googleusercontent.com'; // ex: 123456789-abc.apps.googleusercontent.com

// ══════════════════════════════════════════
//  💳 CONFIGURATION PAIEMENTS
//  Remplace les clés ci-dessous après inscription
// ══════════════════════════════════════════

// ── FedaPay (Togo: T-Money, Flooz, Visa, Mastercard) ──
// Inscription gratuite → https://fedapay.com
window.FEDAPAY_PUBLIC_KEY = 'pk_sandbox_VOTRE_CLE_FEDAPAY';
// Passe en 'production' quand tu es prêt
window.FEDAPAY_ENV = 'sandbox'; // 'sandbox' pour test | 'live' pour vrai argent

// ── CinetPay (Orange Money, MTN MoMo, Moov, Wave) ──
// Inscription gratuite → https://cinetpay.com
window.CINETPAY_APIKEY  = 'VOTRE_APIKEY_CINETPAY';
window.CINETPAY_SITE_ID = 'VOTRE_SITE_ID_CINETPAY';

// ── Prix des services en FCFA (1€ ≈ 655 FCFA) ──
window.PRIX_FCFA = {
  'Optimisation CV':   32000,  // ~49€
  'CV Optimization':   32000,
  'Lettre de motivation': 25600, // ~39€
  'Cover Letter':       25600,
  'Préparation entretien': 45300, // ~69€
  'Interview Prep':     45300,
  'Pack complet':       84700,  // ~129€
  'Full Package':       84700,
};

// ══════════════════════════════════════════
//  BASE DE DONNÉES LOCALE (localStorage)
//  Chaque utilisateur a ses propres données
// ══════════════════════════════════════════
const DB = {
  getUsers:()=>JSON.parse(localStorage.getItem('lr_users')||'[]'),
  saveUsers:(u)=>localStorage.setItem('lr_users',JSON.stringify(u)),
  getSession:()=>JSON.parse(localStorage.getItem('lr_session')||'null'),
  saveSession:(s)=>localStorage.setItem('lr_session',JSON.stringify(s)),
  clearSession:()=>localStorage.removeItem('lr_session'),
  getProfile:(id)=>JSON.parse(localStorage.getItem(`lr_profile_${id}`)||'null'),
  saveProfile:(id,p)=>localStorage.setItem(`lr_profile_${id}`,JSON.stringify(p)),
  getApps:(id)=>JSON.parse(localStorage.getItem(`lr_apps_${id}`)||'[]'),
  saveApps:(id,a)=>localStorage.setItem(`lr_apps_${id}`,JSON.stringify(a)),
  getFavs:(id)=>JSON.parse(localStorage.getItem(`lr_favs_${id}`)||'[]'),
  saveFavs:(id,f)=>localStorage.setItem(`lr_favs_${id}`,JSON.stringify(f)),
  register:(name,email,password)=>{
    const users=DB.getUsers();
    const emailClean=email.toLowerCase().trim();
    if(users.find(u=>u.email.toLowerCase().trim()===emailClean))
      return {error:'Cet email est déjà utilisé. Connectez-vous plutôt.'};
    const id='u_'+Date.now();
    const isAdmin=emailClean.includes('admin');
    const user={id,name:name.trim(),email:email.trim(),password:password.trim(),isAdmin,createdAt:new Date().toISOString()};
    users.push(user);
    DB.saveUsers(users);
    DB.saveProfile(id,{title:'',location:'Lomé, Togo',bio:'',skills:'',experience:'',photo:null});
    const session={id,name:name.trim(),email:email.trim(),isAdmin};
    DB.saveSession(session);
    return {session};
  },
  login:(email,password)=>{
    const users=DB.getUsers();
    if(!users||users.length===0) return {error:'Aucun compte trouvé. Veuillez d\'abord vous inscrire.'};
    const user=users.find(u=>u.email.toLowerCase().trim()===email.toLowerCase().trim());
    if(!user) return {error:`Email introuvable. Vérifiez l'orthographe ou inscrivez-vous.`};
    if(user.password.trim()!==password.trim()) return {error:'Mot de passe incorrect. Réessayez.'};
    const session={id:user.id,name:user.name,email:user.email,isAdmin:user.isAdmin};
    DB.saveSession(session);
    return {session};
  }
};

// ══════════════════════════════════════════
//  DONNÉES

function App(){
  const [lang,setLang]=useState(localStorage.getItem('lr_lang')||'fr');
  const [page,setPage]=useState('home');
  const [session,setSession]=useState(()=>DB.getSession());
  const [selJob,setSelJob]=useState(null);
  const [showApply,setShowApply]=useState(false);
  const [showSpontan,setShowSpontan]=useState(false);
  const [showService,setShowService]=useState(false);
  const [selService,setSelService]=useState(null);
  const [toast,setToast]=useState(null);
  const [search,setSearch]=useState('');
  const [sec,setSec]=useState(0);
  const [typ,setTyp]=useState(0);
  const [loc,setLoc]=useState(0);
  const [currentPage,setCurrentPage]=useState(1);
  const [mobileMenu,setMobileMenu]=useState(false);
  const [submissions,setSubmissions]=useState(()=>JSON.parse(localStorage.getItem('lr_submissions')||'[]'));
  const t=T[lang];

  useEffect(()=>{localStorage.setItem('lr_lang',lang);},[lang]);
  useEffect(()=>{localStorage.setItem('lr_submissions',JSON.stringify(submissions));},[submissions]);

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3500);};
  const go=(p,job=null)=>{setSelJob(job);setPage(p);setMobileMenu(false);window.scrollTo(0,0);};

  const login=(sess)=>{setSession(sess);DB.saveSession(sess);};
  const logout=()=>{setSession(null);DB.clearSession();go('home');showToast(lang==='fr'?'Déconnecté avec succès':'Logged out successfully');};

  const SECTORS=lang==='fr'?SECTORS_FR:SECTORS_EN;
  const TYPES=lang==='fr'?TYPES_FR:TYPES_EN;
  const LOCS=lang==='fr'?LOCS_FR:LOCS_EN;
  const PER_PAGE=6;

  const filtered=JOBS_DATA.filter(j=>{
    const q=search.toLowerCase();
    const title=lang==='fr'?j.title:(j.titleEn||j.title);
    return(!q||title.toLowerCase().includes(q)||j.company.toLowerCase().includes(q)||j.skills.some(s=>s.toLowerCase().includes(q)))
      &&(sec===0||j.sector===SECTORS[sec])
      &&(typ===0||j.type===(lang==='fr'?TYPES_FR:TYPES_EN)[typ])
      &&(loc===0||j.location.includes(LOCS[loc].split(',')[0]));
  });
  const totalPages=Math.ceil(filtered.length/PER_PAGE);
  const paginated=filtered.slice((currentPage-1)*PER_PAGE,currentPage*PER_PAGE);

  const favs=session?DB.getFavs(session.id):[];
  const toggleFav=(id)=>{
    if(!session){go('auth');return;}
    const cur=DB.getFavs(session.id);
    const next=cur.includes(id)?cur.filter(i=>i!==id):[...cur,id];
    DB.saveFavs(session.id,next);
    showToast(cur.includes(id)?t.toasts.favRemove:t.toasts.favAdd);
    setPage(p=>p); // force re-render
  };
  const apps=session?DB.getApps(session.id):[];
  const addApp=(app)=>{
    if(!session)return;
    const cur=DB.getApps(session.id);
    DB.saveApps(session.id,[...cur,app]);
    setPage(p=>p);
  };

  const displayName=session?.name;
  const profile=session?DB.getProfile(session.id):null;

  const navLinks=[
    {p:'jobs',l:t.nav.jobs},{p:'formations',l:t.nav.formations},
    {p:'cv-builder',l:t.nav.cvbuilder},{p:'recruiter',l:t.nav.recruiter},
  ];

  const NavBar=()=>(
    <>
    <nav>
      <div className="nav-inner">
        <button className="logo-wrap" onClick={()=>go('home')}>
          <LogoD size={36}/><span className="logo-text">Le <span>Réseau</span></span>
        </button>
        <div className="nav-links">
          {navLinks.map(({p,l})=>(
            <button key={p} className={`nav-link ${page===p?'active':''}`} onClick={()=>go(p)}>{l}</button>
          ))}

    <svg width="18" height="18" viewBox="0 0 24 24">

function Auth({t,lang,login,go,showToast}){
  const [tab,setTab]=useState('login');
  const [form,setForm]=useState({name:'',email:'',password:''});
  const [errors,setErrors]=useState({});
  const [loading,setLoading]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const upd=(k,v)=>{setForm(f=>({...f,[k]:v}));setErrors(e=>({...e,[k]:null}));};

  // ── Connexion / Inscription classique ──
  const submit=async()=>{
    const e={};
    if(tab==='register'&&!validate.required(form.name)) e.name=t.errors.required;
    if(!validate.email(form.email)) e.email=t.errors.invalidEmail;
    if(!validate.password(form.password)) e.password=t.errors.shortPw;
    setErrors(e);
    if(Object.keys(e).length) return;
    setLoading(true);
    await new Promise(r=>setTimeout(r,500));
    if(tab==='register'){
      const res=DB.register(form.name.trim(),form.email.trim(),form.password.trim());
      if(res.error){showToast(res.error,'error');setLoading(false);return;}
      login(res.session);
      showToast(t.toasts.registered(form.name.trim()));
      go('profile');
    } else {
      const res=DB.login(form.email.trim(),form.password.trim());
      if(res.error){showToast(res.error,'error');setLoading(false);return;}
      login(res.session);
      showToast(t.toasts.loginSuccess(res.session.name));
      go(res.session.isAdmin?'admin':'profile');
    }
    setLoading(false);
  };

  // ── Google OAuth (nécessite GOOGLE_CLIENT_ID configuré) ──
  const handleGoogle=()=>{
    if(!window.GOOGLE_CLIENT_ID||window.GOOGLE_CLIENT_ID==='VOTRE_CLIENT_ID'){
      showToast(lang==='fr'?'Google login non configuré — voir instructions ci-dessous':'Google login not set up — see instructions below','error');
      return;
    }
    const params=new URLSearchParams({
      client_id:window.GOOGLE_CLIENT_ID,
      redirect_uri:window.location.href.split('?')[0],
      response_type:'token',
      scope:'email profile',
      prompt:'select_account',
    });
    window.location.href='https://accounts.google.com/o/oauth2/auth?'+params;
  };

  // ── Récupérer token Google au retour de l'OAuth ──
  useEffect(()=>{
    const hash=new URLSearchParams(window.location.hash.replace('#',''));
    const token=hash.get('access_token');
    if(!token) return;
    window.history.replaceState(null,'',window.location.pathname);
    fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})
      .then(r=>r.json())
      .then(info=>{
        const email=info.email;
        const name=info.name||email.split('@')[0];
        const photo=info.picture||null;
        // Chercher compte existant ou créer
        const users=DB.getUsers();
        let user=users.find(u=>u.email.toLowerCase()===email.toLowerCase());
        let id;
        if(!user){
          id='u_'+Date.now();
          const isAdmin=email.toLowerCase().includes('admin');
          const newUser={id,name,email,password:'__google__',isAdmin,createdAt:new Date().toISOString(),googlePhoto:photo};
          users.push(newUser);
          DB.saveUsers(users);
          DB.saveProfile(id,{title:'',location:'',bio:'',skills:'',experience:'',photo});
        } else {
          id=user.id;
          if(photo){const p=DB.getProfile(id)||{};DB.saveProfile(id,{...p,photo:p.photo||photo});}
        }
        const sess={id,name,email,isAdmin:user?.isAdmin||false};
        login(sess);
        showToast((lang==='fr'?'Connecté avec Google : ':'Signed in with Google: ')+name);
        go('profile');
      })
      .catch(()=>showToast('Erreur Google login','error'));
  },[]);

  return(
    <div className="fade-in" style={{maxWidth:440,margin:'60px auto',paddingBottom:80}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{marginBottom:16,display:'inline-flex'}}><LogoD size={52}/></div>
        <h1 style={{fontFamily:"'Fraunces',serif",fontSize:28,color:'#fff',marginBottom:6}}>
          {tab==='login'?t.auth.loginTitle:t.auth.regTitle}
        </h1>
        <p style={{color:'var(--gris)',fontSize:14}}>{tab==='login'?t.auth.loginSub:t.auth.regSub}</p>
      </div>

      <div className="card" style={{padding:36}}>
        <div className="tabs" style={{marginBottom:28}}>
          <button className={`tab ${tab==='login'?'active':''}`} onClick={()=>{setTab('login');setErrors({});setForm(f=>({...f,name:''}));}}>
            {t.auth.loginTab}
          </button>
          <button className={`tab ${tab==='register'?'active':''}`} onClick={()=>{setTab('register');setErrors({});}}>
            {t.auth.regTab}
          </button>
        </div>

        {/* Bouton Google */}
        <button onClick={handleGoogle} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'#fff',border:'1.5px solid rgba(255,255,255,.15)',borderRadius:'var(--radius)',padding:'11px 16px',fontFamily:"'Outfit',sans-serif",fontWeight:600,fontSize:14,cursor:'pointer',marginBottom:20,color:'#3c4043',transition:'all .2s'}}
          onMouseOver={e=>{e.currentTarget.style.boxShadow='0 2px 12px rgba(0,0,0,.25)';}}
          onMouseOut={e=>{e.currentTarget.style.boxShadow='none';}}>
          <GoogleIcon/>
          {lang==='fr'?`Continuer avec Google`:`Continue with Google`}
        </button>

        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <div style={{flex:1,height:1,background:'rgba(255,255,255,.08)'}}/>
          <span style={{fontSize:12,color:'var(--gris)',flexShrink:0}}>{lang==='fr'?'ou avec votre email':'or with your email'}</span>
          <div style={{flex:1,height:1,background:'rgba(255,255,255,.08)'}}/>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {tab==='register'&&(
            <div className="field-group">
              <label className="field-label">{t.auth.name}</label>
              <input className={`field ${errors.name?'error':''}`} placeholder={t.auth.namePh}
                value={form.name} onChange={e=>upd('name',e.target.value)}/>
              {errors.name&&<span className="field-error">{errors.name}</span>}
            </div>
          )}
          <div className="field-group">
            <label className="field-label">{t.auth.email}</label>
            <input className={`field ${errors.email?'error':''}`} type="email" placeholder={t.auth.emailPh}
              value={form.email} onChange={e=>upd('email',e.target.value)}/>
            {errors.email&&<span className="field-error">{errors.email}</span>}
          </div>
          <div className="field-group">
            <label className="field-label">{t.auth.password}</label>
            <div style={{position:'relative'}}>
              <input className={`field ${errors.password?'error':''}`}
                type={showPw?'text':'password'}
                placeholder={t.auth.pwPh}
                style={{paddingRight:46}}
                value={form.password}
                onChange={e=>upd('password',e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&submit()}/>
              <button onClick={()=>setShowPw(p=>!p)}
                style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--gris)',fontSize:16,padding:0,lineHeight:1}}>
                {showPw?'🙈':'👁️'}
              </button>
            </div>
            {errors.password&&<span className="field-error">{errors.password}</span>}
          </div>

          <button className="btn btn-primary btn-full" style={{marginTop:4,padding:15,fontSize:15}}
            onClick={submit} disabled={loading}>
            {loading
              ?<><span className="spinner"/> {lang==='fr'?'Chargement...':'Loading...'}</>
              :(tab==='login'?t.auth.loginBtn:t.auth.regBtn)
            }
          </button>
        </div>
      </div>

      {/* Info Google setup */}
      {(!window.GOOGLE_CLIENT_ID||window.GOOGLE_CLIENT_ID==='VOTRE_CLIENT_ID')&&(
        <div style={{background:'rgba(201,168,76,.07)',border:'1px solid rgba(201,168,76,.2)',borderRadius:12,padding:'14px 18px',marginTop:12}}>
          <p style={{fontSize:12,color:'var(--or)',fontWeight:600,marginBottom:4}}>
            {lang==='fr'?'⚙️ Pour activer Google login :':'⚙️ To enable Google login:'}
          </p>
          <p style={{fontSize:12,color:'var(--gris)',lineHeight:1.7}}>
            {lang==='fr'
              ?'Ouvre ce fichier HTML avec un éditeur, cherche VOTRE_CLIENT_ID et remplace-le par ton Client ID Google (voir instructions WhatsApp).'
              :'Open this HTML file in a text editor, find VOTRE_CLIENT_ID and replace it with your Google Client ID (see WhatsApp instructions).'}
          </p>
        </div>
      )}

      <div style={{background:'rgba(123,30,46,.08)',border:'1px solid rgba(123,30,46,.2)',borderRadius:12,padding:'14px 18px',marginTop:12,textAlign:'center'}}>
        <p style={{fontSize:13,color:'var(--gris)'}}>🏢 <button onClick={()=>go('recruiter')} style={{background:'none',border:'none',color:'var(--bordeaux-light)',cursor:'pointer',fontWeight:600,fontSize:13,fontFamily:"'Outfit',sans-serif",textDecoration:'underline'}}>{t.auth.recruiterNote}</button></p>
      </div>
    </div>
  );
}

function Jobs({t,lang,jobs,allJobs,favs,toggleFav,go,search,setSearch,sec,setSec,typ,setTyp,loc,setLoc,SECTORS,TYPES,LOCS,currentPage,setCurrentPage,totalPages}){
  return(
    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>
      <div style={{marginBottom:28}}>
        <h2 style={{fontFamily:"'Fraunces',serif",fontSize:28,color:'#fff',marginBottom:4}}>{t.jobsPage.title}</h2>
        <p style={{color:'var(--gris)',fontSize:14}}>{allJobs.length} {t.jobsPage.found}</p>
      </div>
      <div className="card" style={{padding:20,marginBottom:24}}>
        <input className="field" style={{marginBottom:14}} placeholder={t.jobsPage.searchPh} value={search} onChange={e=>setSearch(e.target.value)}/>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
          {[[t.jobsPage.sector,SECTORS,sec,setSec],[t.jobsPage.type,TYPES,typ,setTyp],[t.jobsPage.location,LOCS,loc,setLoc]].map(([label,opts,val,setVal])=>(
            <div key={label}>
              <label className="field-label">{label}</label>
              <select className="field" style={{width:'auto',fontSize:13}} value={val} onChange={e=>setVal(Number(e.target.value))}>
                {opts.map((o,i)=><option key={o} value={i}>{o}</option>)}
              </select>
            </div>
          ))}
          <button className="btn btn-ghost btn-sm" style={{color:'var(--bordeaux-light)'}} onClick={()=>{setSearch('');setSec(0);setTyp(0);setLoc(0);}}>{t.jobsPage.reset}</button>
        </div>
      </div>
      {jobs.length===0?(
        <div style={{textAlign:'center',padding:'72px 0'}}><div style={{fontSize:52,marginBottom:16}}>🔍</div><h3 style={{fontFamily:"'Fraunces',serif",color:'#fff',marginBottom:8}}>{t.jobsPage.noResult}</h3><p style={{color:'var(--gris)'}}>{t.jobsPage.noResultSub}</p></div>
      ):(
        <>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {jobs.map(job=>(
            <div key={job.id} className="card" style={{padding:20,cursor:'pointer',display:'flex',gap:18,alignItems:'center',flexWrap:'wrap'}} onClick={()=>go('detail',job)}>
              <div className="logo-badge" style={{width:52,height:52,fontSize:15}}>{job.logo}</div>
              <div style={{flex:1,minWidth:200}}>
                <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:3}}>
                  <span style={{fontWeight:700,fontSize:15,color:'#fff'}}>{lang==='fr'?job.title:job.titleEn||job.title}</span>
                  <span className="tag" style={{fontSize:11}}>{job.type}</span>
                </div>
                <div style={{fontSize:13,color:'var(--gris)'}}>{job.company} · {job.location}</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:6}}>{job.skills.slice(0,3).map(s=><span key={s} className="tag" style={{fontSize:10}}>{s}</span>)}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8}}>
                <span style={{fontSize:14,color:'var(--or)',fontWeight:600}}>💰 {job.salary}</span>
                <div style={{display:'flex',gap:6}}>
                  <button onClick={e=>{e.stopPropagation();toggleFav(job.id);}} className="btn btn-icon" style={{background:favs.includes(job.id)?'rgba(192,57,74,.15)':'rgba(255,255,255,.04)',border:favs.includes(job.id)?'1px solid rgba(192,57,74,.4)':'1px solid rgba(255,255,255,.08)',color:favs.includes(job.id)?'#E87A8A':'var(--gris)',fontSize:15}}>{favs.includes(job.id)?'♥':'♡'}</button>
                  <button className="btn btn-primary btn-sm" onClick={e=>{e.stopPropagation();go('detail',job);}}>{t.jobsPage.viewOffer}</button>
                </div>
              </div>
            </div>
          ))}
        </div>
        {totalPages>1&&(
          <div className="pagination">
            <button className="page-btn" disabled={currentPage===1} onClick={()=>setCurrentPage(p=>p-1)}>‹</button>
            {Array.from({length:totalPages},(_,i)=>i+1).map(p=><button key={p} className={`page-btn ${currentPage===p?'active':''}`} onClick={()=>setCurrentPage(p)}>{p}</button>)}
            <button className="page-btn" disabled={currentPage===totalPages} onClick={()=>setCurrentPage(p=>p+1)}>›</button>
          </div>
        )}
        </>
      )}
    </div>
  );
}

function Detail({t,lang,job,session,apps,favs,toggleFav,go,openApply,showToast}){
  if(!job) return <div style={{padding:'80px 0',textAlign:'center'}}><button className="btn btn-ghost" onClick={()=>go('jobs')}>← Retour</button></div>;
  const already=apps.some(a=>a.job?.id===job.id);
  const isFav=favs.includes(job.id);
  const title=lang==='fr'?job.title:(job.titleEn||job.title);
  const desc=lang==='fr'?job.desc:(job.descEn||job.desc);
  return(
    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>
      <button onClick={()=>go('jobs')} className="btn btn-ghost btn-sm" style={{marginBottom:24}}>{t.detail.back}</button>
      <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:24,alignItems:'start'}} className="detail-grid">
        <div>
          <div className="card" style={{padding:32,marginBottom:14}}>
            <div style={{display:'flex',gap:18,marginBottom:22}}>
              <div className="logo-badge" style={{width:64,height:64,fontSize:20}}>{job.logo}</div>
              <div>
                <h1 style={{fontFamily:"'Fraunces',serif",fontSize:26,color:'#fff',marginBottom:4,letterSpacing:'-.5px'}}>{title}</h1>
                <div style={{color:'var(--gris)',fontSize:15}}>{job.company}</div>
              </div>
            </div>
            <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:20}}>
              {[['📍',job.location],['💼',job.type],['💰',job.salary],['👥',`${job.applicants} candidats`],['📅',lang==='fr'?job.posted:job.postedEn]].map(([ic,v])=>(
                <div key={v} style={{display:'flex',gap:6,alignItems:'center',fontSize:13}}><span>{ic}</span><span style={{color:'var(--gris)'}}>{v}</span></div>
              ))}
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{job.skills.map(s=><span key={s} className="tag">{s}</span>)}</div>
          </div>
          <div className="card" style={{padding:32}}>
            <h2 style={{fontFamily:"'Fraunces',serif",fontSize:18,color:'#fff',marginBottom:14}}>{t.detail.desc}</h2>
            <p style={{color:'var(--gris)',lineHeight:1.82,marginBottom:28,fontSize:14}}>{desc}</p>
            <h3 style={{color:'#fff',marginBottom:14,fontSize:15,fontWeight:700}}>{t.detail.skills}</h3>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {job.skills.map(s=>(
                <div key={s} style={{display:'flex',alignItems:'center',gap:12,fontSize:14}}>
                  <div style={{width:22,height:22,borderRadius:'50%',background:'rgba(123,30,46,.15)',display:'flex',alignItems:'center',justifyContent:'center',color:'#E87A8A',fontSize:11,flexShrink:0}}>✓</div>
                  <span style={{color:'var(--creme)'}}>{s}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{position:'sticky',top:88}}>
          <div className="boost-block" style={{marginBottom:14}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:2,color:'#E87A8A',marginBottom:10,textTransform:'uppercase'}}>{t.detail.boost}</div>
            <h3 style={{fontFamily:"'Fraunces',serif",color:'#fff',fontSize:16,marginBottom:8}}>{t.detail.boostSub}</h3>
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:16}}>
              {[['📄',lang==='fr'?'Optimisation CV':'CV Optimization','49€'],['✍️',lang==='fr'?'Lettre de motivation':'Cover Letter','39€'],['🎯',lang==='fr'?'Préparation entretien':'Interview Prep','69€']].map(([ic,ttl,pr])=>(
                <div key={ttl} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'rgba(255,255,255,.04)',borderRadius:8,padding:'9px 12px'}}>
                  <span style={{fontSize:13,color:'rgba(245,240,232,.75)'}}>{ic} {ttl}</span>
                  <span style={{fontSize:13,fontWeight:700,color:'var(--or)'}}>{pr}</span>
                </div>
              ))}
            </div>
            <a href="mailto:dominobusiness.co@gmail.com" className="btn btn-secondary btn-full">{lang==='fr'?'⭐ Pack complet — 129€':'⭐ Full package — €129'}</a>
          </div>
          <div className="card" style={{padding:24,marginBottom:12}}>
            {already?(
              <div style={{background:'rgba(45,158,107,.1)',border:'1px solid rgba(45,158,107,.25)',borderRadius:10,padding:14,textAlign:'center',color:'#4DC99A',fontWeight:600,marginBottom:12}}>{t.detail.applied}</div>
            ):(
              <button className="btn btn-primary btn-full" style={{marginBottom:10}} onClick={openApply}>{session?t.detail.applyNow:t.detail.loginToApply}</button>

          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
//  PROFILE — Données par utilisateur
// ══════════════════════════════════════════
function Profile({t,lang,session,apps,favs,jobs,go,showToast,setPage}){
  const photoRef=useRef(null);
  const [pf,setPf]=useState(()=>session?DB.getProfile(session.id)||{title:'',location:'Lomé, Togo',bio:'',skills:'',experience:'',photo:null}:{});
  const [tab,setTab]=useState('apps');
  const favJobs=jobs.filter(j=>favs.includes(j.id));

  if(!session) return(
    <div style={{padding:'80px 0',textAlign:'center'}}>
      <h2 style={{color:'#fff',fontFamily:"'Fraunces',serif",marginBottom:16}}>{lang==='fr'?'Accès réservé':'Access required'}</h2>
      <button className="btn btn-primary" onClick={()=>go('auth')}>{lang==='fr'?'Se connecter':'Log in'}</button>
    </div>
  );

  const save=()=>{DB.saveProfile(session.id,pf);showToast(t.toasts.saved);};

  const handlePhoto=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>5*1024*1024){showToast(lang==='fr'?'Image trop lourde (max 5 Mo)':'Image too large (max 5MB)','error');return;}
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const photo=ev.target.result;
      setPf(p=>({...p,photo}));
      DB.saveProfile(session.id,{...pf,photo});
      showToast(lang==='fr'?'Photo mise à jour !':'Photo updated!');
    };
    reader.readAsDataURL(file);
  };

  return(
    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:32,flexWrap:'wrap',gap:16}}>
        <div><h1 style={{fontFamily:"'Fraunces',serif",fontSize:30,color:'#fff',marginBottom:4}}>{t.profile.title}</h1><p style={{color:'var(--gris)',fontSize:14}}>{t.profile.sub}</p></div>
        <button className="btn btn-secondary" onClick={()=>go('cv-builder')}>{t.profile.cvBtn}</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'280px 1fr',gap:24,alignItems:'start'}} className="profile-grid">
        <div>
          <div className="card" style={{padding:26,marginBottom:14}}>
            <div style={{display:'flex',gap:14,alignItems:'center',marginBottom:22}}>
              <div className="avatar-wrap">
                <input ref={photoRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto}/>
                {pf.photo
                  ?<img src={pf.photo} className="avatar-photo" style={{width:68,height:68}} alt="profil"/>
                  :<div className="avatar" style={{width:68,height:68,fontSize:26}}>{session.name.charAt(0).toUpperCase()}</div>
                }
                <button className="avatar-upload-btn" title={lang==='fr'?'Changer la photo':'Change photo'} onClick={()=>photoRef.current.click()}>📷</button>
              </div>
              <div>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:17,color:'#fff'}}>{session.name}</div>
                <div style={{fontSize:13,color:'var(--gris)'}}>{pf.title||lang==='fr'?'Titre du poste':'Job title'}</div>
                <div style={{fontSize:12,color:'var(--gris-2)',marginTop:2}}>✉️ {session.email}</div>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {[[t.profile.titleField,'title'],[t.profile.locField,'location'],[t.profile.expField,'experience']].map(([lbl,k])=>(
                <div key={k}><label className="field-label">{lbl}</label><input className="field" value={pf[k]||''} onChange={e=>setPf(p=>({...p,[k]:e.target.value}))}/></div>
              ))}
              <div><label className="field-label">{t.profile.bioField}</label><textarea className="field" rows={3} style={{resize:'vertical'}} value={pf.bio||''} onChange={e=>setPf(p=>({...p,bio:e.target.value}))}/></div>
              <div><label className="field-label">{t.profile.skillsField}</label><input className="field" value={pf.skills||''} placeholder="React, Excel, Marketing..." onChange={e=>setPf(p=>({...p,skills:e.target.value}))}/></div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-primary" style={{flex:1}} onClick={save}>{t.profile.save}</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>go('cv-builder')}>{t.profile.dlCV}</button>
              </div>
            </div>
          </div>
          {pf.skills&&<div className="card" style={{padding:18}}><div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:'var(--gris)',textTransform:'uppercase',marginBottom:10}}>Skills</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{pf.skills.split(',').map(s=>s.trim()).filter(Boolean).map(s=><span key={s} className="tag" style={{fontSize:11}}>{s}</span>)}</div></div>}
        </div>
        <div>
          <div className="tabs" style={{marginBottom:22}}>
            {[['apps',`${t.profile.tabApps} (${apps.length})`],['favs',`${t.profile.tabFavs} (${favJobs.length})`],['formations',t.profile.tabFormations]].map(([k,l])=>(
              <button key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>
            ))}
          </div>
          {tab==='apps'&&(apps.length===0?(

// ══════════════════════════════════════════
//  RECRUITER
// ══════════════════════════════════════════
function Recruiter({t,lang,go,showToast,addSubmission}){
  const [form,setForm]=useState({company:'',contact:'',email:'',phone:'',title:'',loc:'',type:'CDI',sector:'Tech',salary:'',skills:'',desc:''});
  const [errors,setErrors]=useState({});
  const [sent,setSent]=useState(false);
  const [loading,setLoading]=useState(false);
  const upd=(k,v)=>{setForm(f=>({...f,[k]:v}));setErrors(e=>({...e,[k]:null}));};
  const submit=async()=>{
    const e={};
    if(!form.company.trim())e.company=t.errors.required;
    if(!validate.email(form.email))e.email=t.errors.invalidEmail;
    if(!form.title.trim())e.title=t.errors.required;
    if(!form.desc.trim())e.desc=t.errors.required;
    setErrors(e);if(Object.keys(e).length)return;
    setLoading(true);
    try{await fetch('https://formspree.io/f/xyknkvpk',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({...form,_subject:`[Le Réseau] Offre recruteur — ${form.title} chez ${form.company}`})});}catch(_){}
    addSubmission({...form,id:Date.now(),status:'pending',createdAt:new Date().toLocaleDateString('fr-FR')});
    setLoading(false);setSent(true);showToast(t.toasts.offerSub);
  };
  if(sent)return(
    <div className="fade-in" style={{maxWidth:560,margin:'80px auto',textAlign:'center',paddingBottom:80}}>
      <div style={{width:80,height:80,background:'rgba(45,158,107,.1)',border:'1px solid rgba(45,158,107,.3)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,margin:'0 auto 24px'}}>✓</div>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:28,color:'#fff',marginBottom:12}}>{t.recruiterPage.successTitle}</h1>
      <p style={{color:'var(--gris)',fontSize:15,lineHeight:1.75,marginBottom:24}}>{t.recruiterPage.successMsg} <strong style={{color:'var(--creme)'}}>{form.email}</strong></p>
      <button className="btn btn-primary btn-lg" onClick={()=>go('home')}>{t.recruiterPage.backHome}</button>
    </div>
  );
  return(
    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>
      <div style={{maxWidth:720,margin:'0 auto'}}>
        <div style={{marginBottom:36}}>
          <div className="section-label">{lang==='fr'?'Espace Recruteur':'Recruiter Space'}</div>
          <h1 style={{fontFamily:"'Fraunces',serif",fontSize:32,color:'#fff',marginBottom:8}}>{t.recruiterPage.title}</h1>
          <p style={{color:'var(--gris)',lineHeight:1.75}}>{t.recruiterPage.sub}</p>
        </div>
        <div style={{background:'rgba(123,30,46,.08)',border:'1px solid rgba(123,30,46,.2)',borderRadius:12,padding:'16px 20px',marginBottom:28,display:'flex',gap:14}}>
          <span style={{fontSize:20}}>🛡️</span>
          <p style={{fontSize:13,color:'var(--gris)',lineHeight:1.6}}>{t.recruiterPage.shield}</p>
        </div>
        <div className="card" style={{padding:36}}>
          <h2 style={{fontFamily:"'Fraunces',serif",fontSize:17,color:'#fff',marginBottom:20,paddingBottom:12,borderBottom:'1px solid rgba(255,255,255,.07)'}}>{t.recruiterPage.companySection}</h2>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:28}}>
            {[[t.recruiterPage.company,'company'],[t.recruiterPage.contact,'contact'],[t.recruiterPage.email,'email'],[t.recruiterPage.phone,'phone']].map(([lbl,k])=>(
              <div key={k} className="field-group"><label className="field-label">{lbl}</label><input className={`field ${errors[k]?'error':''}`} value={form[k]} onChange={e=>upd(k,e.target.value)}/>{errors[k]&&<span className="field-error">{errors[k]}</span>}</div>
            ))}
          </div>
          <h2 style={{fontFamily:"'Fraunces',serif",fontSize:17,color:'#fff',marginBottom:20,paddingBottom:12,borderBottom:'1px solid rgba(255,255,255,.07)'}}>{t.recruiterPage.jobSection}</h2>
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div className="field-group"><label className="field-label">{t.recruiterPage.jobTitle}</label><input className={`field ${errors.title?'error':''}`} value={form.title} onChange={e=>upd('title',e.target.value)}/>{errors.title&&<span className="field-error">{errors.title}</span>}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div><label className="field-label">{t.recruiterPage.loc}</label><input className="field" value={form.loc} onChange={e=>upd('loc',e.target.value)}/></div>
              <div><label className="field-label">{t.recruiterPage.salary}</label><input className="field" value={form.salary} onChange={e=>upd('salary',e.target.value)}/></div>
              <div><label className="field-label">{t.recruiterPage.contract}</label><select className="field" value={form.type} onChange={e=>upd('type',e.target.value)}>{TYPES_FR.slice(1).map(o=><option key={o}>{o}</option>)}</select></div>
              <div><label className="field-label">{t.recruiterPage.sector}</label><select className="field" value={form.sector} onChange={e=>upd('sector',e.target.value)}>{SECTORS_FR.slice(1).map(o=><option key={o}>{o}</option>)}</select></div>
            </div>
            <div><label className="field-label">{t.recruiterPage.skills}</label><input className="field" placeholder="React, Node.js, SQL..." value={form.skills} onChange={e=>upd('skills',e.target.value)}/></div>
            <div className="field-group"><label className="field-label">{t.recruiterPage.desc}</label><textarea className={`field ${errors.desc?'error':''}`} rows={5} style={{resize:'vertical'}} value={form.desc} onChange={e=>upd('desc',e.target.value)}/>{errors.desc&&<span className="field-error">{errors.desc}</span>}</div>
          </div>
          <button className="btn btn-primary btn-full" style={{marginTop:24,padding:15,fontSize:15}} onClick={submit} disabled={loading}>
            {loading?<><span className="spinner"/> {lang==='fr'?'Envoi...':'Sending...'}</>:t.recruiterPage.submit}
          </button>
          <p style={{textAlign:'center',fontSize:12,color:'var(--gris-2)',marginTop:10}}>{t.recruiterPage.note}</p>
        </div>
      </div>
    </div>
  );
}

//  CV BUILDER
// ══════════════════════════════════════════
function CVBuilder({t,lang,session,go,showToast}){
  const profile=session?DB.getProfile(session.id):null;
  const [step,setStep]=useState(1);
  const [cv,setCv]=useState({name:session?.name||'',title:profile?.title||'',email:session?.email||'',phone:'',loc:profile?.location||'',summary:profile?.bio||'',exp:'',edu:'',skills:profile?.skills||''});
  const upd=(k,v)=>setCv(c=>({...c,[k]:v}));
  return(
    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>
      <div style={{maxWidth:820,margin:'0 auto'}}>
        <div style={{marginBottom:32}}>
          <h1 style={{fontFamily:"'Fraunces',serif",fontSize:30,color:'#fff',marginBottom:6}}>{t.cvb.title}</h1>
          <p style={{color:'var(--gris)',fontSize:14}}>{t.cvb.sub}</p>
        </div>
        <div className="step-bar">{t.cvb.steps.map((_,i)=><div key={i} className={`step-seg ${step>i?'done':'todo'}`}/>)}</div>
        <div style={{display:'flex',gap:8,marginBottom:24,marginTop:8}}>{t.cvb.steps.map((s,i)=><div key={i} style={{flex:1,textAlign:'center',fontSize:12,fontWeight:600,color:step===i+1?'var(--bordeaux-light)':'var(--gris)',transition:'color .3s'}}>{s}</div>)}</div>
        {step===1&&(
          <div className="card" style={{padding:32}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
              {[[t.cvb.nameLbl,'name',t.cvb.namePh],[t.cvb.titleLbl,'title',t.cvb.titlePh],[t.cvb.emailLbl,'email',t.cvb.emailPh],[t.cvb.phoneLbl,'phone',t.cvb.phonePh],[t.cvb.locLbl,'loc',t.cvb.locPh]].map(([lbl,k,ph])=>(
                <div key={k}><label className="field-label">{lbl}</label><input className="field" placeholder={ph} value={cv[k]} onChange={e=>upd(k,e.target.value)}/></div>
              ))}
            </div>
            <div><label className="field-label">{t.cvb.summaryLbl}</label><textarea className="field" rows={3} style={{resize:'vertical'}} placeholder={t.cvb.summaryPh} value={cv.summary} onChange={e=>upd('summary',e.target.value)}/></div>
            <button className="btn btn-primary btn-full" style={{marginTop:20}} onClick={()=>setStep(2)}>{t.cvb.next}</button>
          </div>
        )}
        {step===2&&(
          <div className="card" style={{padding:32}}>
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div><label className="field-label">{t.cvb.expLbl}</label><textarea className="field" rows={5} style={{resize:'vertical'}} placeholder={t.cvb.expPh} value={cv.exp} onChange={e=>upd('exp',e.target.value)}/></div>
              <div><label className="field-label">{t.cvb.eduLbl}</label><textarea className="field" rows={3} style={{resize:'vertical'}} placeholder={t.cvb.eduPh} value={cv.edu} onChange={e=>upd('edu',e.target.value)}/></div>
              <div><label className="field-label">{t.cvb.skillsLbl}</label><input className="field" placeholder={t.cvb.skillsPh} value={cv.skills} onChange={e=>upd('skills',e.target.value)}/></div>
            </div>
            <div style={{display:'flex',gap:10,marginTop:20}}>
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>{t.cvb.prev}</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={()=>setStep(3)}>{t.cvb.next}</button>
            </div>
          </div>
        )}
        {step===3&&(
          <div>
            <div className="cv-preview" style={{marginBottom:20,boxShadow:'0 20px 60px rgba(0,0,0,.5)'}}>
              <div className="cv-head">
                <h2 style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,marginBottom:4}}>{cv.name||t.cvb.namePh}</h2>
                <p style={{fontSize:15,opacity:.85,marginBottom:12}}>{cv.title}</p>
                <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:13,opacity:.75}}>
                  {cv.email&&<span>✉ {cv.email}</span>}
                  {cv.phone&&<span>📞 {cv.phone}</span>}
                  {cv.loc&&<span>📍 {cv.loc}</span>}
                </div>
              </div>
              <div className="cv-body">
                <div>
                  {cv.summary&&<div style={{marginBottom:24}}><div className="cv-section-title">{lang==='fr'?'Profil':'Profile'}</div><p style={{fontSize:13,color:'#333',lineHeight:1.75}}>{cv.summary}</p></div>}
                  {cv.exp&&<div><div className="cv-section-title">{t.cvb.expLbl}</div><pre style={{fontSize:13,color:'#333',lineHeight:1.75,whiteSpace:'pre-wrap',fontFamily:"'Outfit',sans-serif"}}>{cv.exp}</pre></div>}
                </div>
                <div>
                  {cv.edu&&<div style={{marginBottom:22}}><div className="cv-section-title">{t.cvb.eduLbl}</div><pre style={{fontSize:13,color:'#333',lineHeight:1.75,whiteSpace:'pre-wrap',fontFamily:"'Outfit',sans-serif"}}>{cv.edu}</pre></div>}
                  {cv.skills&&<div><div className="cv-section-title">{t.cvb.skillsLbl}</div><div style={{display:'flex',flexWrap:'wrap',gap:5}}>{cv.skills.split(',').map(s=>s.trim()).filter(Boolean).map(s=><span key={s} style={{background:'rgba(123,30,46,.1)',color:'var(--bordeaux)',borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:600}}>{s}</span>)}</div></div>}
                </div>
              </div>
            </div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-ghost" onClick={()=>setStep(2)}>{t.cvb.prev}</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={()=>showToast(t.toasts.cvDl)}>{t.cvb.download}</button>
              <button className="btn btn-ghost" onClick={()=>{if(session){DB.saveProfile(session.id,{...DB.getProfile(session.id)||{},title:cv.title,location:cv.loc,bio:cv.summary,skills:cv.skills});showToast(t.toasts.saved);}else{showToast(lang==='fr'?'Connectez-vous pour sauvegarder':'Log in to save','error');}}}>{t.cvb.save}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Admin({t,lang,jobs,submissions,setSubmissions,showToast}){

    <div className="fade-in" style={{paddingTop:40,paddingBottom:80}}>

function ApplyModal({t,lang,job,session,profile,onClose,onSend}){
  const [name,setName]=useState(session?.name||'');
  const [email,setEmail]=useState(session?.email||'');
  const [msg,setMsg]=useState('');
  const [step,setStep]=useState(1);
  const [errors,setErrors]=useState({});
  const [loading,setLoading]=useState(false);
  const next=()=>{
    const e={};
    if(!name.trim())e.name=t.errors.required;
    if(!validate.email(email))e.email=t.errors.invalidEmail;
    setErrors(e);if(!Object.keys(e).length)setStep(2);
  };
  const send=async()=>{
    setLoading(true);
    try{await fetch('https://formspree.io/f/xyknkvpk',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name,email,message:msg,job:job.title,company:job.company,_subject:`[Le Réseau] Candidature — ${job.title} chez ${job.company} (${name})`})});}catch(_){}
    setLoading(false);
    onSend({name,email,msg});
  };
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h2 className="modal-title">{t.apply.title}</h2><button className="modal-close" onClick={onClose}>✕</button></div>
        <div style={{background:'var(--noir-3)',borderRadius:10,padding:14,marginBottom:20,border:'1px solid rgba(255,255,255,.06)'}}>
          <div style={{fontWeight:700,color:'#fff',fontSize:14}}>{lang==='fr'?job.title:job.titleEn||job.title}</div>
          <div style={{fontSize:12,color:'var(--gris)'}}>{job.company} · {job.location}</div>
        </div>
        {step===1?(
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="field-group"><label className="field-label">{t.apply.name}</label><input className={`field ${errors.name?'error':''}`} value={name} onChange={e=>setName(e.target.value)}/>{errors.name&&<span className="field-error">{errors.name}</span>}</div>
            <div className="field-group"><label className="field-label">{t.apply.email}</label><input className={`field ${errors.email?'error':''}`} type="email" value={email} onChange={e=>setEmail(e.target.value)}/>{errors.email&&<span className="field-error">{errors.email}</span>}</div>
            <div><label className="field-label">{t.apply.msg}</label><textarea className="field" rows={4} style={{resize:'vertical'}} placeholder={t.apply.msgPh} value={msg} onChange={e=>setMsg(e.target.value)}/></div>
            <div style={{background:'rgba(123,30,46,.06)',borderRadius:10,padding:11,fontSize:12,color:'var(--gris)',border:'1px dashed rgba(123,30,46,.25)'}}>{t.apply.cvNote}</div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={next}>{t.apply.step1}</button>
              <button className="btn btn-ghost" onClick={onClose}>{t.apply.cancel}</button>
            </div>
          </div>
        ):(
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:52,marginBottom:14}}>✉️</div>
            <h3 style={{fontFamily:"'Fraunces',serif",color:'#fff',fontSize:20,marginBottom:12}}>{t.apply.confirm}</h3>
            <p style={{color:'var(--gris)',marginBottom:24,lineHeight:1.7,fontSize:14}}>{t.apply.confirmSub} <strong style={{color:'#fff'}}>{lang==='fr'?job.title:job.titleEn}</strong> {t.apply.at} <strong style={{color:'#fff'}}>{job.company}</strong><br/>{t.apply.sentTo} <span style={{color:'var(--bordeaux-light)'}}>{email}</span></p>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={send} disabled={loading}>{loading?<span className="spinner"/>:t.apply.step2}</button>
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>{t.apply.back}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

              <div><label className="field-label">{t.spont.msg}</label><textarea className="field" rows={3} style={{resize:'vertical'}} placeholder={t.spont.msgPh} value={form.msg} onChange={e=>upd('msg',e.target.value)}/></div>

                <button className="btn btn-primary" style={{flex:1}} onClick={submit} disabled={loading}>{loading?<span className="spinner"/>:t.spont.send}</button>

              </div>
            </div>

        ):(
          <div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{width:72,height:72,background:'rgba(45,158,107,.12)',border:'1px solid rgba(45,158,107,.3)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 20px'}}>✓</div>

function ServiceModal({t,lang,service,onClose,showToast}){
  const [form,setForm]=useState({name:'',email:'',phone:''});
  const [errors,setErrors]=useState({});
  const [step,setStep]=useState('info');   // 'info' | 'method' | 'paying' | 'done'
  const [payMethod,setPayMethod]=useState(null);
  const [loading,setLoading]=useState(false);
  const upd=(k,v)=>{setForm(f=>({...f,[k]:v}));setErrors(e=>({...e,[k]:null}));};

  if(!service)return null;

  const montantFCFA = window.PRIX_FCFA?.[service.title] || 32000;
  const fedaOk = window.FEDAPAY_PUBLIC_KEY && !window.FEDAPAY_PUBLIC_KEY.includes('VOTRE');
  const cinetOk = window.CINETPAY_APIKEY && !window.CINETPAY_APIKEY.includes('VOTRE');

  const validate_form=()=>{
    const e={};
    if(!form.name.trim()) e.name=t.errors.required;
    if(!validate.email(form.email)) e.email=t.errors.invalidEmail;
    setErrors(e);
    return Object.keys(e).length===0;
  };

  // ── Notif email après paiement ──
  const notifyFormspree=async(method)=>{
    try{
      await fetch('https://formspree.io/f/xyknkvpk',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({
          ...form, service:service.title, prix:`${montantFCFA} FCFA (${service.price})`,
          methode_paiement: method,
          _subject:`[Le Réseau] ✅ PAIEMENT — ${service.title} (${form.name})`
        })
      });
    }catch(_){}
  };

  // ── FedaPay (T-Money, Flooz, Visa, Mastercard) ──
  const payFedaPay=()=>{
    if(!validate_form()) return;
    if(!fedaOk){showToast('FedaPay non configuré — clé manquante','error');return;}
    setStep('paying');
    try{
      FedaPay.init({
        sandbox: window.FEDAPAY_ENV!=='live',
        public_key: window.FEDAPAY_PUBLIC_KEY,
        transaction:{
          amount: montantFCFA,
          description: `${service.title} — Le Réseau`,
        },
        customer:{
          email: form.email.trim(),
          lastname: form.name.trim(),
          phone_number: form.phone ? { number: form.phone.replace(/\s/g,''), country:'tg' } : undefined,
        },
        onComplete:(resp)=>{
          if(resp.reason==='CHECKOUT COMPLETED'||resp.reason==='FedaPay::CHECKOUT_COMPLETED'){
            notifyFormspree('FedaPay (T-Money/Flooz/Carte)');
            setStep('done');
            showToast(lang==='fr'?'Paiement confirmé ! Merci 🎉':'Payment confirmed! Thank you 🎉');
          } else {
            setStep('method');
            showToast(lang==='fr'?'Paiement annulé.':'Payment cancelled.','error');
          }
        },
        onError:(err)=>{
          setStep('method');
          showToast('Erreur FedaPay: '+err,'error');
        }
      }).open();
    }catch(err){
      setStep('method');
      showToast('FedaPay non disponible. Essaie une autre méthode.','error');
    }
  };

  // ── CinetPay (Orange Money, MTN, Moov, Wave) ──
  const payCinetPay=()=>{
    if(!validate_form()) return;
    if(!cinetOk){showToast('CinetPay non configuré — clé manquante','error');return;}
    setStep('paying');
    try{
      const txId = 'LR'+Date.now();
      CinetPay.setConfig({
        apikey: window.CINETPAY_APIKEY,
        site_id: window.CINETPAY_SITE_ID,
        notify_url: 'https://lereseau.netlify.app/notify',
        mode: 'PRODUCTION',
      });
      CinetPay.getCheckout({
        transaction_id: txId,
        amount: montantFCFA,
        currency: 'XOF',
        channels: 'ALL',
        description: `${service.title} — Le Réseau`,
        customer_name: form.name.trim(),
        customer_email: form.email.trim(),
        customer_phone_number: form.phone||'',
        customer_address: 'Lomé, Togo',
        customer_city: 'Lomé',
        customer_country: 'TG',
        customer_state: 'TG',
        customer_zip_code: '00228',
        invoice_data: { service: service.title },
      });
      CinetPay.waitResponse((data)=>{
        if(data.status==='ACCEPTED'){
          notifyFormspree('CinetPay (Orange Money/MTN/Wave)');
          setStep('done');
          showToast(lang==='fr'?'Paiement confirmé ! Merci 🎉':'Payment confirmed! Thank you 🎉');
        } else {
          setStep('method');
          showToast(lang==='fr'?'Paiement non abouti.':'Payment not completed.','error');
        }
      });
      CinetPay.onError((err)=>{
        setStep('method');
        showToast('CinetPay: '+JSON.stringify(err),'error');
      });
    }catch(err){
      setStep('method');
      showToast('CinetPay non disponible. Essaie une autre méthode.','error');
    }
  };

  // ── WhatsApp / Paiement manuel ──
  const payWhatsApp=()=>{
    if(!validate_form()) return;
    const msg=encodeURIComponent(
      `Bonjour Le Réseau 👋\n\nJe souhaite commander :\n📦 ${service.title} (${service.price})\n\n👤 Nom : ${form.name}\n✉️ Email : ${form.email}${form.phone?'\n📞 Tél : '+form.phone:''}\n\nMerci !`
    );
    notifyFormspree('WhatsApp (manuel)');
    window.open(`https://wa.me/22897483734?text=${msg}`,'_blank');
    setStep('done');
  };

  // ── Étape 1 : Infos client ──
  if(step==='info') return(

      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>

        </div>
        <p style={{color:'var(--gris)',fontSize:14,marginBottom:10}}>{service.desc}</p>

        {/* Prix en € et FCFA */}
        <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:22,flexWrap:'wrap'}}>
          <div style={{background:'rgba(201,168,76,.1)',border:'1px solid rgba(201,168,76,.25)',borderRadius:10,padding:'8px 16px',display:'inline-flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:'var(--or-light)'}}>{service.price}</span>
          </div>
          <div style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:10,padding:'8px 16px',display:'inline-flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:14,color:'var(--gris)'}}>≈</span>
            <span style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:'var(--creme)'}}>{montantFCFA.toLocaleString('fr-FR')} FCFA</span>
          </div>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:14}}>

            onMouseOut={e=>e.currentTarget.style.borderColor='rgba(37,211,102,.3)'}>
            <div style={{width:48,height:48,borderRadius:12,background:'rgba(37,211,102,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:'#fff',fontSize:15,marginBottom:3}}>WhatsApp {lang==='fr'?'(Toujours disponible)':'(Always available)'}</div>
              <div style={{fontSize:12,color:'var(--gris)',lineHeight:1.5}}>{lang==='fr'?'Envoie ta commande par WhatsApp, nous t\'envoyons les instructions de paiement T-Money/Flooz.':'Send your order via WhatsApp, we\'ll send payment instructions.'}</div>
            </div>
            <span style={{fontSize:11,background:'rgba(37,211,102,.15)',border:'1px solid rgba(37,211,102,.3)',borderRadius:6,padding:'3px 8px',color:'#25D366',flexShrink:0}}>✓ Actif</span>
          </button>

        </div>

        <div style={{marginTop:14,display:'flex',gap:10}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setStep('info')}>← {lang==='fr'?'Retour':'Back'}</button>
          <div style={{flex:1,background:'rgba(255,255,255,.04)',borderRadius:10,padding:'10px 14px',fontSize:12,color:'var(--gris)'}}>
            🔒 {lang==='fr'?'Paiement 100% sécurisé — Confirmation par email':'100% secure payment — Email confirmation'}
          </div>
        </div>
      </div>
    </div>
  );

  // ── Étape 3 : Paiement en cours ──
  if(step==='paying') return(
    <div className="overlay">
      <div className="modal" style={{maxWidth:380,textAlign:'center',padding:48}}>
        <div className="spinner" style={{width:48,height:48,borderWidth:5,margin:'0 auto 24px'}}/>
        <h3 style={{fontFamily:"'Fraunces',serif",fontSize:20,color:'#fff',marginBottom:8}}>
          {lang==='fr'?'Paiement en cours...':'Processing payment...'}
        </h3>
        <p style={{color:'var(--gris)',fontSize:14}}>{lang==='fr'?'Ne ferme pas cette fenêtre':'Do not close this window'}</p>
      </div>
    </div>
  );

  // ── Étape 4 : Succès ──
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:420,textAlign:'center'}} onClick={e=>e.stopPropagation()}>
        <div style={{width:80,height:80,background:'rgba(45,158,107,.12)',border:'2px solid rgba(45,158,107,.4)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,margin:'0 auto 24px'}}>✓</div>
        <h2 style={{fontFamily:"'Fraunces',serif",fontSize:26,color:'#fff',marginBottom:12}}>
          {lang==='fr'?'Paiement réussi !':'Payment successful!'}
        </h2>
        <p style={{color:'var(--gris)',lineHeight:1.75,fontSize:14,marginBottom:8}}>
          {lang==='fr'?'Merci':'Thank you'} <strong style={{color:'#fff'}}>{form.name}</strong> !
        </p>
        <p style={{color:'var(--gris)',fontSize:13,marginBottom:6}}>
          {lang==='fr'?'Confirmation envoyée à':'Confirmation sent to'} <strong style={{color:'var(--bordeaux-light)'}}>{form.email}</strong>
        </p>
        <div style={{background:'rgba(45,158,107,.08)',border:'1px solid rgba(45,158,107,.2)',borderRadius:12,padding:'12px 16px',margin:'20px 0',fontSize:13,color:'#4DC99A'}}>
          📦 <strong>{service.title}</strong> — {montantFCFA.toLocaleString('fr-FR')} FCFA
        </div>
        <p style={{fontSize:13,color:'var(--gris)',marginBottom:24}}>
          {lang==='fr'?'Notre équipe te contacte sous 24h pour démarrer.':'Our team will contact you within 24h to get started.'}
        </p>
        <button className="btn btn-primary btn-lg btn-full" onClick={onClose}>
          {lang==='fr'?'Fermer':'Close'}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
